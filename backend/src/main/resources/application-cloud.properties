# Cloud AI: Google Gemini
spring.ai.model.chat=google-genai

# Disable Ollama embeddings in cloud
spring.ai.model.embedding=none

# Enable Google GenAI embeddings
spring.ai.model.embedding.text=google-genai

# Gemini API authentication
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Chat model
spring.ai.google.genai.chat.model=gemini-2.5-flash-lite

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Embedding model: preserve 768 dimensions
spring.ai.google.genai.embedding.text.model=text-embedding-004
spring.ai.google.genai.embedding.text.dimensions=768
